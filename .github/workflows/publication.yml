name: Publication validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication-check:
    name: Publication gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify runtime-only changes
        id: scope
        run: python3 .publication/gate.py --classify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install review and rendering clients
        run: |
          npm install --prefix "$RUNNER_TEMP/copilot" @github/copilot@1.0.88
          echo "$RUNNER_TEMP/copilot/node_modules/.bin" >> "$GITHUB_PATH"
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Install shared prose toolchain into the runner home
        run: |
          mkdir -p "$HOME/.agents/prose" "$HOME/.agents/skills/faith-reason-note"
          cp .publication/runtime/review.py .publication/runtime/handoff.py .publication/runtime/quote_layout.py "$HOME/.agents/prose/"
          cp .publication/runtime/contract.md .publication/runtime/drafting.md .publication/runtime/council-article.md .publication/runtime/editorial.md .publication/runtime/paragraphs.md "$HOME/.agents/prose/"
          cp .publication/runtime/validate_article.py "$HOME/.agents/skills/faith-reason-note/validate.py" 2>/dev/null || true
      - name: Test mechanical publication boundaries
        run: python3 .publication/test_gate.py
      - name: Exercise actual reviewer on unpublished regression cases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .publication/evaluate.py --output "$RUNNER_TEMP/reviewer-evaluation"
      - name: Verify runtime-only update preserves public artifacts
        if: steps.scope.outputs.mode == 'runtime'
        env:
          RUNTIME_BASE: ${{ steps.scope.outputs.base }}
        run: python3 .publication/gate.py --runtime-base "$RUNTIME_BASE" --output "$RUNNER_TEMP/publication-review"
      - name: Validate exact public artifacts and obtain independent decisions
        if: steps.scope.outputs.mode == 'publication'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .publication/gate.py --output "$RUNNER_TEMP/publication-review"
      - name: Retain original reviewer responses and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reviewer-evaluation
            ${{ runner.temp }}/publication-review
          retention-days: 90
      - name: Stage checked public assets
        if: steps.scope.outputs.mode == 'publication'
        run: python3 .publication/stage.py "$RUNNER_TEMP/publication-review/result.json" "$RUNNER_TEMP/checked-site"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.scope.outputs.mode == 'publication'
        with:
          path: ${{ runner.temp }}/checked-site
  deploy:
    name: Deploy checked site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.publication-check.outputs.mode == 'publication'
    needs: publication-check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
