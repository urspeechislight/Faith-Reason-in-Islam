<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shi'i theological analysis, apologetics, and comparative religion: browse every paper by domain, from the Qur'an and its critics to the Imams and the Light." />
  <meta property="og:title" content="Faith &amp; Reason in Islam — The Library" />
  <meta property="og:description" content="Browse every paper by domain: the Qur'an and its critics, defending the Prophet, hadith and chains, Christianity and the Bible, the Household and history, the Imams and the Light." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://urspeechislight.github.io/Faith-Reason-in-Islam/" />
  <title>Faith &amp; Reason in Islam — The Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Scheherazade+New:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script>
    /* Pre-paint theme: a dark visitor never flashes light. */
    (function () {
      try {
        var asked = new URLSearchParams(location.search).get('theme');
        if (localStorage.getItem('fri-theme') === 'dark' || asked === 'dark')
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <style>
    /* ────────────────────────────────────────────────────────────────────────
       Tokens: antique gold / neutral parchment, one source for every value.
       ──────────────────────────────────────────────────────────────────────── */
    :root {
      --paper-0: #ffffff;
      --paper-50: #faf8f2;
      --paper-100: #f3f0e7;
      --paper-150: #ebe7da;
      --paper-200: #e1dccb;
      --paper-300: #d0c8b2;
      --paper-400: #b3ac98;

      --ink-900: #19150f;
      --ink-800: #211c15;
      --ink-700: #3a3328;
      --ink-600: #564e41;
      --ink-500: #6c6454;
      --ink-400: #88806e;

      --gold-700: #6a5320;
      --gold-600: #836a2c;
      --gold-500: #8a6e2c;
      --gold-400: #b39140;
      --gold-300: #cba955;
      --gold-200: #e4d3a0;
      --gold-tint: #ebe1c7;
      --gold-wash: #f4eedd;

      --night-900: #100d08;
      --night-800: #15110b;
      --night-700: #1a1610;
      --night-600: #221c14;
      --night-500: #2c2519;
      --night-400: #3e3525;
      --sand-100: #ede5d2;
      --sand-300: #b6ab94;
      --sand-500: #8a7e68;
      --sand-600: #766c58;

      --blue-500: #3c63b0; --green-500: #2e7d5b; --teal-500: #2c8090;

      --color-bg: var(--paper-150);
      --color-surface: var(--paper-50);
      --color-surface-raised: var(--paper-0);
      --color-surface-sunken: var(--paper-100);
      --color-app-bar: rgba(251, 251, 252, 0.86);
      --color-text: var(--ink-800);
      --color-text-muted: var(--ink-600);
      --color-text-faint: var(--ink-500);
      --color-text-ghost: var(--ink-400);
      --color-border: var(--paper-200);
      --color-border-strong: var(--paper-300);
      --color-border-hair: var(--paper-100);
      --color-accent: var(--gold-500);
      --color-accent-strong: var(--gold-400);
      --color-accent-deep: var(--gold-700);
      --color-accent-tint: var(--gold-tint);
      --color-accent-wash: var(--gold-wash);
      --color-mark-bg: rgba(192, 122, 42, 0.45);

      --cat-debate: var(--gold-600);
      --cat-exegesis: var(--blue-500);
      --cat-narration: var(--green-500);
      --cat-reference: var(--teal-500);

      --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
      --font-ar: 'Scheherazade New', 'Amiri', 'Noto Naskh Arabic', serif;
      --font-ar-display: 'Amiri', 'Scheherazade New', serif;

      --text-xs: 12px; --text-sm: 14px; --text-base: 15px; --text-md: 17px;
      --text-lg: 21px; --text-xl: 26px; --text-2xl: 34px;

      --tracking-label: 0.14em; --tracking-micro: 0.05em; --tracking-section: 0.22em;
      --leading-tight: 1.15; --leading-snug: 1.4; --leading-normal: 1.6;
      --leading-relaxed: 1.85; --leading-arabic: 2.05;

      --space-2xs: 2px; --space-xs: 4px; --space-sm: 8px; --space-md: 12px;
      --space-lg: 16px; --space-xl: 24px; --space-2xl: 32px; --space-3xl: 40px;

      --radius-xs: 6px; --radius-sm: 9px; --radius-md: 14px; --radius-lg: 20px;
      --radius-control: var(--radius-sm);

      --shadow-sm: 0 1px 2px rgba(54, 44, 24, 0.06);
      --shadow-md: 0 2px 4px rgba(54, 44, 24, 0.05), 0 8px 24px -10px rgba(54, 44, 24, 0.18);
      --shadow-row: 0 10px 30px -14px rgba(54, 44, 24, 0.25);

      --duration-fast: 120ms; --duration-base: 200ms; --duration-slow: 340ms;
      --ease-out: cubic-bezier(0.22, 0.8, 0.3, 1);

      --header-height: 60px;
      --z-header: 200;
      color-scheme: light;
    }
    [data-theme='dark'] {
      --color-bg: var(--night-900);
      --color-surface: var(--night-700);
      --color-surface-raised: var(--night-600);
      --color-surface-sunken: var(--night-800);
      --color-app-bar: rgba(26, 22, 16, 0.86);
      --color-text: var(--sand-100);
      --color-text-muted: var(--sand-300);
      --color-text-faint: var(--sand-500);
      --color-text-ghost: var(--sand-600);
      --color-border: var(--night-500);
      --color-border-strong: var(--night-400);
      --color-border-hair: var(--night-800);
      --color-accent: var(--gold-300);
      --color-accent-strong: var(--gold-200);
      --color-accent-deep: var(--gold-300);
      --color-accent-tint: rgba(203, 169, 85, 0.16);
      --color-accent-wash: rgba(203, 169, 85, 0.10);
      --color-mark-bg: rgba(216, 154, 85, 0.42);
      --cat-debate: var(--gold-300);
      --cat-exegesis: #6f92d8;
      --cat-narration: #5bb389;
      --cat-reference: #55a3b3;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.3), 0 8px 24px -10px rgba(0, 0, 0, 0.6);
      --shadow-row: 0 10px 30px -14px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }

    /* ── base ─────────────────────────────────────────────────────────────── */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      color: var(--color-text);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--color-accent-deep); outline-offset: 2px; border-radius: var(--radius-xs); }
    ::selection { background: var(--color-accent-tint); }
    [dir='rtl'] { font-family: var(--font-ar); }
    .ar { font-family: var(--font-ar); line-height: var(--leading-arabic); }
    .honorific { font-family: var(--font-ar); font-size: 0.75em; line-height: 1; }
    mark { background: var(--color-mark-bg); color: inherit; border-radius: 2px; padding: 0 1px; }

    .eyebrow {
      font-size: var(--text-xs); font-weight: 600; letter-spacing: var(--tracking-label);
      text-transform: uppercase; color: var(--color-accent);
    }
    .apparat {
      display: flex; align-items: baseline; gap: var(--space-sm);
      font-size: var(--text-xs); font-weight: 600; letter-spacing: var(--tracking-label);
      text-transform: uppercase; color: var(--color-text-faint);
      padding-bottom: var(--space-xs);
      position: relative; margin-bottom: var(--space-xs);
    }
    .apparat::after {
      content: ''; flex: 1; height: 1px; align-self: center;
      background: linear-gradient(to right, var(--color-accent), transparent 70%);
      opacity: 0.55;
    }
    .apparat__margin { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0; color: var(--color-accent-deep); }
    .apparat .ar { font-size: var(--text-base); font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--color-text-ghost); }

    /* ── app bar ──────────────────────────────────────────────────────────── */
    .app-bar {
      position: sticky; top: 0; z-index: var(--z-header);
      height: var(--header-height);
      display: flex; align-items: center; gap: var(--space-lg);
      padding: 0 var(--space-xl);
      background: var(--color-app-bar);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--color-border-hair);
    }
    .app-bar__brand {
      display: flex; align-items: baseline; gap: var(--space-sm);
      text-decoration: none; min-width: 0;
    }
    .app-bar__title {
      font-family: var(--font-serif); font-size: var(--text-md); font-weight: 600;
      letter-spacing: -0.01em; white-space: nowrap;
    }
    .app-bar__title em { font-style: italic; color: var(--color-accent-deep); }
    .app-bar__ar { font-size: var(--text-md); color: var(--color-text-faint); white-space: nowrap; }
    .app-bar__spring { flex: 1; }
    .app-bar__link {
      font-size: var(--text-sm); font-weight: 500; text-decoration: none;
      color: var(--color-text-muted); padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-control);
      transition: background var(--duration-base) var(--ease-out), color var(--duration-base) var(--ease-out);
    }
    .app-bar__link:hover { background: var(--color-surface-sunken); color: var(--color-text); }
    .theme-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: var(--radius-control);
      color: var(--color-text-muted);
      transition: background var(--duration-base) var(--ease-out), color var(--duration-base) var(--ease-out);
    }
    .theme-toggle:hover { background: var(--color-surface-sunken); color: var(--color-text); }
    .theme-toggle:active { transform: scale(0.94); }
    [data-theme='dark'] .theme-toggle .i-sun { display: block; }
    [data-theme='dark'] .theme-toggle .i-moon { display: none; }
    .theme-toggle .i-sun { display: none; }

    /* ── page glow ────────────────────────────────────────────────────────── */
    .page-glow { position: relative; isolation: isolate; }
    .page-glow::before {
      content: ''; position: absolute; z-index: -1; pointer-events: none;
      top: -120px; left: 50%; transform: translateX(-50%);
      width: min(1100px, 100vw); height: 560px;
      background: radial-gradient(closest-side, var(--color-accent-wash), transparent 78%);
      opacity: 0.9;
    }

    /* ── library grid ─────────────────────────────────────────────────────── */
    .library { max-width: 1200px; margin: 0 auto; padding: var(--space-xl) var(--space-xl) var(--space-3xl); }
    .library__grid {
      display: grid; grid-template-columns: minmax(260px, 312px) minmax(0, 1fr);
      gap: var(--space-xl); align-items: start;
    }
    .library__pane { min-width: 0; }

    /* ── rail ─────────────────────────────────────────────────────────────── */
    .fih-rail {
      position: sticky; top: calc(var(--header-height) + var(--space-md));
      align-self: start; display: flex; flex-direction: column; gap: var(--space-md);
      max-height: calc(100vh - var(--header-height) - var(--space-xl));
      overflow-y: auto; overscroll-behavior: contain;
      padding-inline-end: var(--space-md);
      border-inline-end: 1px solid var(--color-border);
      scrollbar-width: thin; scrollbar-color: var(--color-border-strong) transparent;
    }
    .fih-mast { display: flex; flex-direction: column; gap: var(--space-2xs); }
    .fih-mast__ar {
      font-family: var(--font-ar-display); font-size: 34px; font-weight: 700;
      color: var(--color-text); line-height: var(--leading-tight);
      align-self: stretch; text-align: right;
    }
    .fih-mast__stat {
      font-family: var(--font-mono); font-size: var(--text-xs);
      color: var(--color-text-faint); line-height: var(--leading-normal);
    }
    .fih-mast__stat b { font-weight: 500; color: var(--color-accent-deep); }

    .fih-controls { display: flex; flex-direction: column; gap: var(--space-sm); }
    .search {
      position: relative; display: flex; align-items: center;
    }
    .search__icon {
      position: absolute; inset-inline-start: var(--space-sm);
      display: inline-flex; color: var(--color-text-ghost); pointer-events: none;
    }
    .search__input {
      width: 100%; height: 34px;
      padding-inline-start: 32px; padding-inline-end: 30px;
      font: inherit; font-size: var(--text-sm);
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-control);
      transition: border-color var(--duration-base) var(--ease-out), box-shadow var(--duration-base) var(--ease-out);
    }
    .search__input::placeholder { color: var(--color-text-ghost); }
    .search__input:focus {
      outline: none; border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-tint);
    }
    .search__clear {
      position: absolute; inset-inline-end: var(--space-2xs);
      display: none; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: var(--radius-xs);
      color: var(--color-text-faint);
    }
    .search__clear:hover { background: var(--color-surface-sunken); color: var(--color-text); }
    .search--filled .search__clear { display: inline-flex; }
    .search__kbd {
      position: absolute; inset-inline-end: var(--space-sm);
      font-family: var(--font-mono); font-size: 10px; color: var(--color-text-ghost);
      border: 1px solid var(--color-border); border-radius: 4px; padding: 0 4px;
      pointer-events: none;
    }
    .search--filled .search__kbd { display: none; }

    .lens { display: flex; gap: 2px; padding: 2px; background: var(--color-surface-sunken); border-radius: var(--radius-control); }
    .lens__btn {
      flex: 1; min-width: 0; height: 26px; padding: 0 var(--space-xs);
      font-size: var(--text-xs); font-weight: 500; letter-spacing: var(--tracking-micro);
      color: var(--color-text-faint); border-radius: 7px;
      transition: background var(--duration-base) var(--ease-out), color var(--duration-base) var(--ease-out), box-shadow var(--duration-base) var(--ease-out);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lens__btn:hover { color: var(--color-text); }
    .lens__btn--on {
      background: var(--color-surface-raised); color: var(--color-text); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .lens__btn:active { transform: translateY(1px); }

    .fih-rule { border: none; height: 1px; margin: 0; background: var(--color-border); }

    .fih-all {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-xs) var(--space-sm);
      font-size: var(--text-sm); font-weight: 500; color: var(--color-text);
      text-decoration: none; border-radius: var(--radius-sm);
      transition: background var(--duration-base) var(--ease-out), box-shadow var(--duration-base) var(--ease-out);
    }
    .fih-all:hover { background: var(--color-surface-sunken); }
    .fih-all--on { background: var(--color-surface-raised); box-shadow: var(--shadow-sm); font-weight: 600; }
    .fih-all__n { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-faint); }

    .fih-doms { display: flex; flex-direction: column; gap: var(--space-2xs); }
    .fih-dom__hd {
      display: flex; align-items: center;
      border-radius: var(--radius-sm);
      transition: background var(--duration-base) var(--ease-out), box-shadow var(--duration-base) var(--ease-out);
    }
    .fih-dom__hd--active { background: var(--color-surface-raised); box-shadow: var(--shadow-sm); }
    .fih-dom__sel {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
      color: var(--color-text); text-decoration: none; border-radius: var(--radius-sm);
      transition: background var(--duration-base) var(--ease-out);
    }
    .fih-dom__sel:hover { background: var(--color-surface-sunken); }
    .fih-dom__hd--active .fih-dom__sel { font-weight: 600; }
    .fih-dom__sel .ds-icon { color: var(--color-accent); flex: none; }
    .fih-dom__en { flex: 1; min-width: 0; font-size: var(--text-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fih-dom__ar { font-size: var(--text-base); color: var(--color-text-muted); }
    .fih-dom__n { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-faint); min-width: 2ch; text-align: right; }
    .fih-dom__chev {
      display: inline-flex; align-items: center; justify-content: center;
      padding: var(--space-xs); color: var(--color-text-ghost); border-radius: var(--radius-sm);
      transition: background var(--duration-base) var(--ease-out), color var(--duration-base) var(--ease-out);
    }
    .fih-dom__chev:hover { background: var(--color-surface-sunken); color: var(--color-text-muted); }
    .fih-dom__chev .ds-icon { transition: transform var(--duration-base) var(--ease-out); }
    .fih-dom__hd--open .fih-dom__chev .ds-icon { transform: rotate(90deg); }
    .fih-dom__cats {
      display: flex; flex-direction: column; gap: 1px;
      padding: var(--space-2xs) 0 var(--space-xs);
    }
    .fih-cat {
      display: flex; align-items: center; gap: var(--space-xs);
      padding: 3px var(--space-sm) 3px var(--space-lg);
      color: var(--color-text-muted); text-decoration: none;
      border-radius: var(--radius-sm); font-size: var(--text-xs);
      transition: background var(--duration-base) var(--ease-out), color var(--duration-base) var(--ease-out);
    }
    .fih-cat:hover { background: var(--color-surface-sunken); color: var(--color-text); }
    .fih-cat__en {
      flex: 1; min-width: 0; font-family: var(--font-serif); font-size: var(--text-sm);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .fih-cat__n { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-faint); }
    .fih-dom--empty { opacity: 0.45; }

    /* ── pane: overview ───────────────────────────────────────────────────── */
    .overview { display: flex; flex-direction: column; gap: var(--space-lg); }
    .overview__head { display: flex; flex-direction: column; gap: var(--space-xs); max-width: 62ch; }
    .overview__title { margin: 0; font-family: var(--font-serif); font-size: var(--text-2xl); font-weight: 600; letter-spacing: -0.01em; line-height: var(--leading-tight); }
    .overview__lede { margin: 0; font-size: var(--text-md); color: var(--color-text-muted); max-width: 58ch; }
    .overview__lede b { font-weight: 600; color: var(--color-text); }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      column-gap: var(--space-lg); row-gap: var(--space-md);
      border-block: 1px solid var(--color-border);
    }
    .stat {
      display: flex; flex-direction: column; gap: var(--space-2xs);
      padding: var(--space-md) 0;
    }
    @media (min-width: 920px) {
      .stat + .stat { padding-inline-start: var(--space-lg); border-inline-start: 1px solid var(--color-border-hair); }
    }
    .stat__n { font-family: var(--font-mono); font-size: var(--text-xl); font-weight: 500; color: var(--color-accent-deep); line-height: 1; }
    .stat__label { font-size: var(--text-xs); font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-text-faint); }
    .stat__label .ar { text-transform: none; letter-spacing: 0; font-weight: 400; margin-inline-start: 2px; color: var(--color-text-ghost); }

    .overview__contents { display: flex; flex-direction: column; gap: var(--space-sm); margin-top: var(--space-xs); }

    .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
    .row { position: relative; }
    .row + .row { border-top: 1px solid var(--color-border-hair); }

    .ix {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: var(--space-lg);
      width: 100%; text-align: start; text-decoration: none;
      padding: var(--space-md) var(--space-sm);
      margin-inline: calc(var(--space-sm) * -1); border-radius: var(--radius-sm);
      transition: background var(--duration-base) var(--ease-out), box-shadow var(--duration-base) var(--ease-out);
    }
    .ix:hover { background: var(--color-accent-wash); }
    .ix:active { transform: translateY(1px); }
    .ix__main { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
    .ix__title {
      display: flex; align-items: baseline; justify-content: space-between;
      column-gap: var(--space-lg); flex-wrap: wrap;
      font-family: var(--font-serif); font-size: var(--text-lg); font-weight: 600;
      line-height: var(--leading-snug); color: var(--color-text);
    }
    .ix__title .ix__t { flex: 1; min-width: 0; }
    .ix__title .ar { font-size: var(--text-lg); color: var(--color-text-muted); font-weight: 400; margin-inline-start: 0; }
    .ix__blurb { display: block; font-size: var(--text-base); line-height: var(--leading-normal); color: var(--color-text-muted); max-width: 60ch; margin: 0; }

    chain: '<path d="M10 13.5a4 4 0 0 0 6 .5l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5"/><path d="M14 10.5a4 4 0 0 0-6-.5l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"/>',
    codex: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M12 6.5v6"/><path d="m9.8 9 2.2-2.5L14.2 9"/>',
    scroll: '<path d="M6 4h12v14a2 2 0 0 1-2 2H6"/><path d="M6 4a2 2 0 0 0-2 2v1h4"/><path d="M18 18H8"/><path d="M9 9h6M9 12.5h6"/>',
    star: '<path d="M12 2.5 14.1 8l5.9.3-4.6 3.7 1.6 5.7L12 14.4l-5 3.3 1.6-5.7L4 8.3 9.9 8 12 2.5z"/>',
    swords: '<path d="M4 4l7 7"/><path d="M20 4l-7 7"/><path d="M4 4h3M4 4v3"/><path d="M20 4h-3M20 4v3"/><path d="m9 15-4 4"/><path d="m15 15 4 4"/><path d="M9 15h-.5A2.5 2.5 0 0 0 6 17.5L7 19l2-4z"/><path d="M15 15h.5A2.5 2.5 0 0 1 18 17.5L17 19l-2-4z"/>',
    index: '<path d="M5 5h14"/><path d="M5 9.5h14"/><path d="M5 14h9"/><path d="M5 18.5h9"/><path d="m16 14.5 4 4m0-4-4 4"/>',
    spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M12 8.5 13.5 12 12 15.5 10.5 12 12 8.5z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/>',
    chevron: '<path d="m9 6 6 6-6 6"/>',
    close: '<path d="M6 6l12 12M18 6 6 18"/>',
    arrow: '<path d="M7 17 17 7"/><path d="M9 7h8v8"/>'
  };
  function icon(name, size) {
    var s = size || 16;
    return '<svg class="ds-icon" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  }

  /* ── helpers ─────────────────────────────────────────────────────────── */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  }); }
  function rich(s) { return esc(s).replace(/(\uFDFA|\uFB75)/g, '<span class="honorific">$1</span>'); }
  function fold(s) {
    return String(s || '').normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[\u064b-\u0652]/g, '')
      .replace(/[\u2018\u2019'`´]/g, '')
      .toLowerCase();
  }
  function fmt(n) { return Number(n).toLocaleString('en-US'); }
  function kw(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n); }
  function countLabel(n, word) {
    var w = word || 'paper' + (n === 1 ? '' : 's');
    return n + ' ' + w;
  }
  var CAT_META = {
    debate:    { label: 'Debate',    ar: 'الجدل' },
    exegesis:  { label: 'Exegesis',  ar: 'التفسير' },
    narration: { label: 'Narration', ar: 'الرواية' },
    reference: { label: 'Reference', ar: 'المرجع' }
  };

  /* ── state ───────────────────────────────────────────────────────────── */
  var catalog = null;
  var state = { domain: null, lens: 'all', q: '', open: {} };

  function lensOf(a) { return state.lens === 'all' || a.category === state.lens; }
  function domainOf(id) { return catalog.domains.find(function (d) { return d.id === id; }); }
  function artsOf(id) {
    return catalog.articles.filter(function (a) { return a.domain === id && !a.comingSoon; });
  }

  /* ── search ──────────────────────────────────────────────────────────── */
  var VARIANTS = {
    a: 'a\u00e0\u00e1\u00e2\u00e4\u00e3\u00e5\u0101\u0103',
    e: 'e\u00e8\u00e9\u00ea\u00eb\u0113',
    i: 'i\u00ec\u00ed\u00ee\u00ef\u012b',
    o: 'o\u00f2\u00f3\u00f4\u00f6\u00f8\u014d',
    u: 'u\u00f9\u00fa\u00fb\u00fc\u016b',
    c: 'c\u00e7\u0107\u010d', n: 'n\u00f1\u0144', s: 's\u0161\u015b\u015f',
    t: 't\u0163\u021b', z: 'z\u017a\u017e'
  };
  function escRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  /* a folded token (plain ascii) turned into a pattern that matches the
     original diacritic-bearing text: Isnād for isnad, Muʿ… safe for esc'd HTML */
  function tokenPattern(t) {
    var out = '';
    for (var i = 0; i < t.length; i++) {
      var ch = t.charAt(i), set = VARIANTS[ch];
      if (ch === "'") out += "(?:'|&#39;|\u2019)";
      else if (set) out += '[' + escRe(set) + ']';
      else out += escRe(ch);
      out += '[\u064B-\u0652]*(?:&#39;|[\u2019\'])?';
    }
    return out;
  }
  function tokensOf(q) {
    return fold(q).split(/\s+/).filter(function (t) { return t.length >= 2; });
  }
  function haystack(a) {
    var dom = domainOf(a.domain) || {};
    return [a.title, a.blurb, a.desc, (a.keywords || []).join(' '),
            dom.en || '', dom.ar || '',
            (a.series ? a.series.parts.map(function (p) { return p.title; }).join(' ') : '')].join(' ');
  }
  function wordsOf(a) {
    if (!a._words) a._words = fold(haystack(a)).split(/[^a-z0-9\u0600-\u06ff']+/).filter(Boolean);
    return a._words;
  }
  function hayOf(a) {
    if (!a._hay) a._hay = fold(haystack(a));
    return a._hay;
  }
  function commonPrefix(x, y) {
    var n = Math.min(x.length, y.length), i = 0;
    while (i < n && x.charAt(i) === y.charAt(i)) i++;
    return i;
  }
  /* a token matches by substring, or by sharing a 5+ char stem with a word
     (corruption ~ corrupted, isnads ~ isnad) */
  function tokenMatches(a, t) {
    if (hayOf(a).indexOf(t) !== -1) return 2;
    var ws = wordsOf(a);
    for (var i = 0; i < ws.length; i++) {
      var p = commonPrefix(ws[i], t);
      if (p >= 5 && p >= Math.min(ws[i].length, t.length) - 2) return 1;
    }
    return 0;
  }
  function matches(a, tokens) {
    for (var i = 0; i < tokens.length; i++) if (!tokenMatches(a, tokens[i])) return false;
    return true;
  }
  function score(a, tokens) {
    var s = 0;
    var title = fold(a.title), kwds = fold((a.keywords || []).join(' ')), blurb = fold(a.blurb);
    tokens.forEach(function (t) {
      if (title.indexOf(t) !== -1) s += 6;
      else if (kwds.indexOf(t) !== -1) s += 3;
      else if (blurb.indexOf(t) !== -1) s += 2;
      else s += 1;
    });
    return s;
  }
  function searchResults(tokens) {
    var hits = catalog.articles.filter(function (a) {
      return !a.comingSoon && lensOf(a) && matches(a, tokens);
    });
    hits.sort(function (x, y) { return score(y, tokens) - score(x, tokens); });
    return hits;
  }
  function highlight(text, tokens) {
    var safe = esc(text);
    if (!tokens.length) return safe;
    var pat = tokens.slice().sort(function (a, b) { return b.length - a.length; })
      .map(tokenPattern).join('|');
    return safe.replace(new RegExp('(' + pat + ')', 'ig'), '<mark>$1</mark>');
  }

  /* ── renderers ───────────────────────────────────────────────────────── */
  function articleMeta(a) {
    var bits = [];
    if (a.quotes) bits.push(fmt(a.quotes) + ' quotes');
    if (a.words) bits.push(kw(a.words) + ' words');
    return bits.join(' · ');
  }

  function renderRail() {
    var el = document.getElementById('rail');
    var arts = catalog.articles.filter(function (a) { return !a.comingSoon; });
    var t = totals();
    var domHtml = catalog.domains.map(function (d) {
      var all = artsOf(d.id).filter(lensOf);
      var n = all.length;
      if (!n) return '';
      var isOn = state.domain === d.id;
      /* tri-state: unset follows the selection, an explicit true/false is
         the user's own fold choice and wins even for the active domain */
      var isOpen = state.open[d.id] === undefined ? isOn : !!state.open[d.id];
      var cls = 'fih-dom__hd' + (isOpen ? ' fih-dom__hd--open' : '') + (isOn ? ' fih-dom__hd--active' : '');
      var rows = all.map(function (a) {
        var n2 = a.series && a.series.parts.length ? '<span class="fih-cat__n">' + a.series.parts.length + '</span>' : '';
        return '<a class="fih-cat" href="' + esc(a.slug) + '.html" title="' + esc(a.title) + '">' +
          '<span class="fih-cat__en">' + rich(a.title) + '</span>' + n2 + '</a>';
      }).join('');
      return '<div class="fih-dom">' +
        '<div class="' + cls + '">' +
          '<a class="fih-dom__sel" href="#/domain/' + d.id + '" aria-label="' + esc(d.en) + ', ' + countLabel(n) + '">' +
            icon(d.icon) +
            '<span class="fih-dom__en">' + esc(d.en) + '</span>' +
            '<span class="fih-dom__ar ar" dir="rtl">' + esc(d.ar) + '</span>' +
            '<span class="fih-dom__n">' + n + '</span>' +
          '</a>' +
          '<button class="fih-dom__chev" type="button" aria-label="' + (isOpen ? 'Collapse' : 'Expand') + ' ' + esc(d.en) + '" aria-pressed="' + isOpen + '" data-toggle="' + d.id + '">' + icon('chevron', 14) + '</button>' +
        '</div>' +
        (isOpen && rows ? '<div class="fih-dom__cats">' + rows + '</div>' : '') +
      '</div>';
    }).join('');

    var lensCats = ['debate', 'exegesis', 'narration', 'reference'].filter(function (c) {
      return arts.some(function (a) { return a.category === c; });
    });
    var lensHtml = '<div class="lens" role="group" aria-label="Category">' +
      ['<button class="lens__btn' + (state.lens === 'all' ? ' lens__btn--on' : '') + '" data-lens="all" type="button">All</button>']
      .concat(lensCats.map(function (c) {
        return '<button class="lens__btn' + (state.lens === c ? ' lens__btn--on' : '') + '" data-lens="' + c + '" type="button">' + CAT_META[c].label + '</button>';
      })).join('') + '</div>';

    el.innerHTML =
      '<header class="fih-mast rise">' +
        '<div class="fih-mast__ar" dir="rtl">المكتبة</div>' +
        '<div class="eyebrow">The Library · الفِهرِست</div>' +
        '<div class="fih-mast__stat">' +
          '<b>' + countLabel(t.articles) + '</b> · ' + t.parts + ' parts · ' +
          t.domains + ' domains · ' + fmt(t.quotes) + ' quotes' +
        '</div>' +
      '</header>' +
      '<div class="fih-controls rise" style="--i:1">' +
        '<div class="search' + (state.q ? ' search--filled' : '') + '">' +
          icon('search', 14) +
          '<input class="search__input" id="searchInput" type="search" autocomplete="off" ' +
            'placeholder="Search the library…" aria-label="Search the library" value="' + esc(state.q) + '" />' +
          '<span class="search__kbd">/</span>' +
          '<button class="search__clear" type="button" id="searchClear" aria-label="Clear search">' + icon('close', 13) + '</button>' +
        '</div>' +
        lensHtml +
      '</div>' +
      '<hr class="fih-rule rise" style="--i:2" />' +
      '<a class="fih-all' + (!state.domain && !state.q ? ' fih-all--on' : '') + '" href="#/" >' +
        '<span>All papers</span><span class="fih-all__n">' + arts.filter(lensOf).length + '</span>' +
      '</a>' +
      '<nav class="fih-doms rise" style="--i:3" aria-label="Domains">' + domHtml + '</nav>';

    wireRail();
  }

  function totals() {
    var arts = catalog.articles.filter(function (a) { return !a.comingSoon; });
    var parts = arts.reduce(function (s, a) { return s + (a.series ? a.series.parts.length : 0); }, 0);
    return {
      articles: arts.length,
      parts: parts,
      domains: catalog.domains.filter(function (d) {
        return d.id !== 'unfiled' && artsOf(d.id).length;
      }).length,
      quotes: arts.reduce(function (s, a) { return s + a.quotes; }, 0),
      words: arts.reduce(function (s, a) { return s + a.words; }, 0),
      categories: ['debate', 'exegesis', 'narration'].filter(function (c) {
        return arts.some(function (a) { return a.category === c; });
      }).length
    };
  }

  function renderOverview() {
    var t = totals();
    var cats = ['debate', 'exegesis', 'narration', 'reference'].map(function (c) {
      var n = catalog.articles.filter(function (a) { return a.category === c && !a.comingSoon; }).length;
      return { c: c, n: n };
    }).filter(function (x) { return x.n > 0; });

    var rows = catalog.domains.map(function (d, i) {
      var all = artsOf(d.id);
      if (!all.length) return '';
      var n = countLabel(all.length);
      return '<li class="row"><button class="ix rise" style="--i:' + (i + 3) + '" type="button" data-domain="' + d.id + '">' +
        '<span class="ix__main">' +
          '<span class="ix__title"><span class="ix__t">' + esc(d.en) + '</span><span class="ar" dir="rtl">' + esc(d.ar) + '</span></span>' +
          '<span class="ix__blurb">' + rich(d.blurb) + '</span>' +
        '</span>' +
        '<span class="ix__meta">' + n + '</span>' +
      '</button></li>';
    }).join('');

    document.getElementById('pane').innerHTML =
      '<section class="overview">' +
        '<header class="overview__head rise">' +
          '<div class="eyebrow">The Fihrist · الفِهرِست</div>' +
          '<h2 class="overview__title">Browse by domain</h2>' +
          '<p class="overview__lede">' + countLabel(t.articles) + ' across ' + t.domains + ' domains, carrying ' +
            fmt(t.quotes) + ' quoted sources and ' + kw(t.words) + ' words of analysis. ' +
            'Choose a domain to begin, or search the catalogue.</p>' +
        '</header>' +
        '<div class="stats rise" style="--i:1">' +
          stat(t.articles, 'Papers', 'بحث') +
          stat(t.parts, 'Series parts', 'أجزاء') +
          stat(t.domains, 'Domains', 'مجال') +
          stat(t.quotes, 'Quotations', 'اقتباس') +
          stat(t.words, 'Words', 'كلمة') +
        '</div>' +
        '<div class="overview__contents">' +
          '<div class="apparat rise" style="--i:2"><span>Domains</span><span class="ar" dir="rtl">المجالات</span>' +
            '<span class="apparat__margin">' + t.domains + '</span></div>' +
          '<ol class="rows">' + rows + '</ol>' +
        '</div>' +
        (cats.length > 1 ? '<div class="apparat rise" style="--i:4"><span>Forms</span><span class="ar" dir="rtl">الأقسام</span></div>' +
          '<ol class="rows">' + cats.map(function (x, i) {
            return '<li class="row"><button class="ix rise" style="--i:' + (i + 5) + '" type="button" data-lens-pick="' + x.c + '">' +
              '<span class="ix__main"><span class="ix__title"><span class="ix__t">' + CAT_META[x.c].label +
              '</span><span class="ar" dir="rtl">' + CAT_META[x.c].ar + '</span></span></span>' +
              '<span class="ix__meta">' + countLabel(x.n) + '</span></button></li>';
          }).join('') + '</ol>' : '') +
      '</section>';
    wirePane();
  }

  function stat(n, label, ar) {
    return '<div class="stat"><span class="stat__n">' + fmt(n) + '</span>' +
      '<span class="stat__label">' + label + '<span class="ar" dir="rtl">' + ar + '</span></span></div>';
  }

  function seriesBlock(a, i) {
    var s = a.series || {};
    var open = !!state.open['series:' + a.slug];
    var parts = (s.parts || []).map(function (p) {
      return '<a class="part" href="' + esc(p.slug) + '.html">' +
        '<span class="part__n">' + (p.part === 99 ? 'App.' : 'Part ' + p.part) + '</span>' +
        '<span class="part__t">' + rich(p.title) + '</span>' +
        '<span class="part__w">' + kw(p.words) + ' words</span></a>';
    }).join('');
    return '<li class="row">' +
      '<div class="series">' +
        '<button class="series__hd' + (open ? ' series__hd--open' : '') + ' rise" style="--i:' + i + '" type="button" data-series="' + esc(a.slug) + '">' +
          '<span class="ix__title">' + rich(a.title) + '</span>' +
          '<span class="series__label">' + esc(s.label || '') + '</span>' +
          '<span class="fih-cat__n">' + (s.parts ? s.parts.length : '') + ' parts ' + icon('chevron', 13) + '</span>' +
        '</button>' +
        (open ? '<div class="series__parts">' + parts + '</div>' : '') +
      '</div></li>';
  }

  function renderDomain() {
    var d = domainOf(state.domain);
    if (!d) { state.domain = null; return renderOverview(); }
    var all = artsOf(d.id);

    var shown = all.filter(lensOf);
    var rows;
    if (!shown.length && all.length) {
      /* the lens emptied this domain: say which forms the papers run in,
         with a way out, instead of a bare "0 of N" dead end */
      var present = {};
      all.forEach(function (a) { present[a.category] = (present[a.category] || 0) + 1; });
      rows = '<li class="row"><div class="empty rise" style="--i:3">' +
        '<p class="empty__title">No ' + esc(CAT_META[state.lens] ? CAT_META[state.lens].label : state.lens) +
          ' papers under this domain</p>' +
        '<p class="empty__hint">The papers here run in other forms:</p>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">' +
        Object.keys(present).map(function (c) {
          return '<button class="empty__action" type="button" data-lens-pick="' + c + '">' +
            (CAT_META[c] ? CAT_META[c].label : c) + ' · ' + present[c] + '</button>';
        }).join('') +
        '<button class="empty__action" type="button" data-lens-pick="all">All forms</button>' +
        '</div></div></li>';
    } else {
      var i = 0;
      rows = catalog.articles.filter(function (a) { return a.domain === d.id; }).map(function (a) {
        i++;
        if (a.comingSoon) {
          return '<li class="row row--soon"><div class="art rise" style="--i:' + i + '">' +
            '<span class="art__main"><span class="art__title" style="color:var(--color-text-faint)">' + rich(a.title) + '</span>' +
            '<p class="art__blurb">' + rich(a.blurb) + '</p></span>' +
            '<span class="art__meta"><span class="chip chip--soon">Coming soon</span></span></div></li>';
        }
        if (a.series) return seriesBlock(a, i);
        if (!lensOf(a)) return '';
        return '<li class="row"><a class="art rise" style="--i:' + i + '" href="' + esc(a.slug) + '.html">' +
          '<span class="art__main">' +
            '<span class="art__title">' + rich(a.title) + '</span>' +
            '<p class="art__blurb">' + rich(a.blurb) + '</p>' +
            '<span class="art__meta"><span class="chip" style="--cat-c:var(--cat-' + a.category + ')">' + CAT_META[a.category].label + '</span>' +
              '<span>' + articleMeta(a) + '</span></span>' +
          '</span>' +
          '<span class="ix__meta">' + icon('arrow', 14) + '</span>' +
        '</a></li>';
      }).join('');
    }

    document.getElementById('pane').innerHTML =
      '<section class="dpane">' +
        '<div class="dpane__crumb rise"><a href="#/">Library</a> / ' + esc(d.en) + '</div>' +
        '<span class="dpane__glyph rise" style="--i:1">' + icon(d.icon, 28) + '</span>' +
        '<h2 class="dpane__title rise" style="--i:1">' + esc(d.en) + '<span class="ar" dir="rtl">' + esc(d.ar) + '</span></h2>' +
        '<p class="dpane__blurb rise" style="--i:2">' + rich(d.blurb) + '</p>' +
        '<div class="overview__contents">' +
          '<div class="apparat rise" style="--i:3"><span>Papers</span><span class="ar" dir="rtl">الأبحاث</span>' +
            '<span class="apparat__margin">' + (state.lens === 'all' ? countLabel(all.length) : shown.length + ' of ' + all.length) + '</span></div>' +
          '<ol class="rows">' + rows + '</ol>' +
        '</div>' +
      '</section>';
    wirePane();
  }

  function renderSearch() {
    var tokens = tokensOf(state.q);
    var hits = searchResults(tokens);
    var el = document.getElementById('pane');
    if (!tokens.length) { state.q = ''; return renderOverview(); }
    if (!hits.length) {
      el.innerHTML =
        '<section class="works">' +
          '<div class="works__crumb rise"><a href="#/">Library</a> / Search</div>' +
          '<div class="empty rise" style="--i:1">' +
            '<span class="empty__icon">' + icon('search', 28) + '</span>' +
            '<p class="empty__title">Nothing matches "' + esc(state.q) + '"</p>' +
            '<p class="empty__hint">Try fewer words, drop the category lens, or check the spelling of a name or verse.</p>' +
            '<button class="empty__action" type="button" id="clearSearch" style="--i:2">Clear search</button>' +
          '</div>' +
        '</section>';
      var btn = document.getElementById('clearSearch');
      if (btn) btn.addEventListener('click', function () { setQuery(''); });
      return;
    }
    var rows = hits.map(function (a, i) {
      var dom = domainOf(a.domain);
      if (a.series) return seriesBlock(a, i + 3);
      return '<li class="row"><a class="art rise" style="--i:' + (i + 3) + '" href="' + esc(a.slug) + '.html">' +
        '<span class="art__main">' +
          '<span class="art__title">' + highlight(a.title, tokens) + '</span>' +
          '<p class="art__blurb">' + highlight(a.blurb, tokens) + '</p>' +
          '<span class="art__meta">' +
            '<span class="chip" style="--cat-c:var(--cat-' + a.category + ')">' + CAT_META[a.category].label + '</span>' +
            '<span class="chip">' + esc(dom.en) + '</span>' +
            '<span>' + articleMeta(a) + '</span>' +
          '</span>' +
        '</span>' +
        '<span class="ix__meta">' + icon('arrow', 14) + '</span>' +
      '</a></li>';
    }).join('');
    el.innerHTML =
      '<section class="works">' +
        '<div class="works__crumb rise"><a href="#/">Library</a> / Search</div>' +
        '<h2 class="works__title rise" style="--i:1">Results for <q>' + esc(state.q) + '</q></h2>' +
        '<div class="works__count rise" style="--i:2">' + hits.length + ' of ' +
          catalog.articles.filter(function (a) { return !a.comingSoon; }).filter(lensOf).length +
          ' papers · ranked by title, keywords, blurb</div>' +
        '<ol class="rows">' + rows + '</ol>' +
      '</section>';
    wirePane();
  }

  function render() {
    renderRail();
    renderPane();
  }
  function renderPane() {
    if (state.q) renderSearch();
    else if (state.domain) renderDomain();
    else renderOverview();
  }
  /* light-weight sync of the rail's query-dependent affordances, so typing
     never rebuilds the rail and steals focus from the input */
  function railSync() {
    var wrap = document.querySelector('.search');
    var input = document.getElementById('searchInput');
    var all = document.querySelector('.fih-all');
    if (wrap) wrap.classList.toggle('search--filled', !!state.q);
    if (input && input.value !== state.q) input.value = state.q;
    if (all) all.classList.toggle('fih-all--on', !state.domain && !state.q);
  }

  /* ── wiring ──────────────────────────────────────────────────────────── */
  function wireRail() {
    var input = document.getElementById('searchInput');
    var timer = null;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      var v = input.value;
      timer = setTimeout(function () { setQuery(v); }, 120);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { setQuery(''); input.blur(); }
    });
    document.getElementById('searchClear').addEventListener('click', function () {
      setQuery(''); input.focus();
    });
    document.querySelectorAll('[data-lens]').forEach(function (b) {
      b.addEventListener('click', function () { setLens(b.getAttribute('data-lens')); });
    });
    document.querySelectorAll('[data-toggle]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-toggle');
        state.open[id] = !state.open[id];
        renderRail();
      });
    });
  }
  function wirePane() {
    document.querySelectorAll('[data-domain]').forEach(function (b) {
      b.addEventListener('click', function () { setDomain(b.getAttribute('data-domain')); });
    });
    document.querySelectorAll('[data-lens-pick]').forEach(function (b) {
      b.addEventListener('click', function () { setLens(b.getAttribute('data-lens-pick')); });
    });
    document.querySelectorAll('[data-series]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = 'series:' + b.getAttribute('data-series');
        state.open[id] = !state.open[id];
        if (state.domain) renderDomain(); else renderSearch();
      });
    });
  }

  /* ── routing ─────────────────────────────────────────────────────────── */
  function setDomain(id) { location.hash = '#/domain/' + id; }
  function setQuery(q) {
    state.q = q;
    syncHash();
    railSync();
    renderPane();
  }
  /* switching lens resets the scope (SOL's changeLens): a lens that empties
     the active domain must never strand the pane at "0 of N" */
  function setLens(l) {
    state.lens = l;
    state.domain = null;
    state.q = '';
    syncHash();
    render();
  }
  function syncHash() {
    var h = '#/';
    if (state.domain) h = '#/domain/' + state.domain;
    else if (state.q) h = '#/q/' + encodeURIComponent(state.q);
    if (location.hash !== h) history.replaceState(null, '', h);
  }
  function parseHash() {
    var m = location.hash.match(/^#\/domain\/([a-z]+)/);
    if (m && catalog && domainOf(m[1])) {
      state.domain = m[1];
      state.q = '';
      state.open[m[1]] = true;  /* selecting a domain opens its accordion */
      return;
    }
    var q = location.hash.match(/^#\/q\/(.+)$/);
    if (q) { state.q = decodeURIComponent(q[1]); state.domain = null; return; }
    state.domain = null; state.q = '';
  }
  window.addEventListener('hashchange', function () { parseHash(); render(); });

  /* ── theme ───────────────────────────────────────────────────────────── */
  document.getElementById('themeToggle').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark';
    if (dark) { root.removeAttribute('data-theme'); } else { root.setAttribute('data-theme', 'dark'); }
    try { localStorage.setItem('fri-theme', dark ? 'light' : 'dark'); } catch (e) {}
  });

  /* ── keyboard ────────────────────────────────────────────────────────── */
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault();
      var i = document.getElementById('searchInput');
      if (i) { i.focus(); i.select(); }
    }
  });

  /* ── boot ────────────────────────────────────────────────────────────── */
  document.getElementById('year').textContent = String(new Date().getFullYear());

  function boot() {
    var el = document.getElementById('catalog-data');
    try {
      catalog = JSON.parse(el.textContent);
      if (!catalog || !catalog.domains || !catalog.domains.length) {
        throw new Error('the catalogue block is empty');
      }
    } catch (err) {
      document.getElementById('app').innerHTML =
        '<div class="error-box">' +
          '<p><strong>The catalogue could not be read.</strong> ' + esc(err.message) + '</p>' +
          '<p>Regenerate it with <code>python3 gen_catalog.py</code> in the repo, then commit <code>index.html</code>.</p>' +
        '</div>';
      return;
    }
    document.getElementById('app').innerHTML =
      '<div class="library__grid">' +
        '<aside class="fih-rail" id="rail" aria-label="Library rail"></aside>' +
        '<div class="library__pane" id="pane"></div>' +
      '</div>';
    parseHash();
    render();
  }
  boot();
  </script>
</body>
</html>
